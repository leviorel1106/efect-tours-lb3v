<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0d10; color: #f2eee6; font-family: 'Rubik', Arial, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; background: #0c0d10; font-size: 1.1rem; z-index: 9; transition: opacity .6s; }
  #load.off { opacity: 0; pointer-events: none; }
  #load b { background: linear-gradient(90deg, #a16cff, #2bd7d6); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 700; }
  .ui { position: fixed; top: max(12px, env(safe-area-inset-top)); inset-inline: 12px; display: flex; flex-wrap: wrap; gap: 8px; z-index: 5; pointer-events: none; }
  .ui button { pointer-events: auto; font: inherit; font-size: .9rem; font-weight: 500; color: #0c0d10; background: #f2eee6; border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  .ui button.alt { background: rgba(12, 13, 16, .72); color: #f2eee6; border: 1px solid #3b3d40; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .ui button.on { background: linear-gradient(90deg, #a16cff, #2bd7d6); color: #0c0d10; border: 0; }
  .hint { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: rgba(12, 13, 16, .72); border: 1px solid #3b3d40; border-radius: 999px; padding: 7px 16px; font-size: .82rem; z-index: 5; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); white-space: nowrap; }
  .joy { position: fixed; bottom: max(26px, env(safe-area-inset-bottom)); width: 108px; height: 108px; border-radius: 50%; background: rgba(12, 13, 16, .45); border: 1px solid rgba(242, 238, 230, .35); z-index: 6; display: none; touch-action: none; }
  .joy i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px; border-radius: 50%; background: rgba(242, 238, 230, .85); }
  .joy small { position: absolute; left: 0; right: 0; top: -24px; text-align: center; font-size: .76rem; font-weight: 700; text-shadow: 0 1px 4px rgba(0, 0, 0, .8); }
  #jm { right: 22px; } #jl { left: 22px; }
  @media (pointer: coarse) { .joy { display: block; } .hint { display: none; } }
#fin{position:fixed;left:12px;top:60px;z-index:5;background:#242922ed;color:#fff9ed;border-radius:10px;padding:10px 14px;max-height:62vh;overflow:auto;width:max-content;max-width:80vw}summary{cursor:pointer;font-weight:bold}#pal label{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:9px 0}select,#resetColors,#steps button{font:inherit;color:#263024;background:#f3efe5;border-radius:6px;border:0;padding:6px 10px;cursor:pointer}#steps{position:fixed;bottom:15px;right:12px;display:flex;gap:4px;z-index:6}#steps button{min-width:38px;min-height:38px;touch-action:none;font-size:21px}.hint{bottom:58px}.ui{max-width:95vw}.ui button.on{background:#b6c9a5}#load b{background:none;color:#dacbb6}@media(pointer:coarse){#steps{display:none}}@media(max-width:540px){.ui{gap:4px}.ui button{font-size:12px;padding:7px 10px}}

<body>
<style>
#load {display:flex;align-items:flex-end;justify-content:flex-start;background:#353029 url("../pictures/arc.jpg") center/cover no-repeat;text-align:right;color:white;}
#load::before {content:"";position:absolute;inset:0;background:linear-gradient(0deg,#14130fed,transparent 68%);}
#load .arrival {position:relative;margin:clamp(18px,5vw,80px);max-width:32em;}
#load h1 {font:500 clamp(28px,5vw,52px)/1.12 Arial,sans-serif;margin:0 0 12px;}
#load p {font:16px/1.5 Arial,sans-serif;margin:0 0 14px;}
#load nav {display:flex;flex-wrap:wrap;gap:8px;}
#load nav a {color:#182019;background:#fffaf0;padding:9px 16px;border-radius:24px;font:600 14px/1.4 Arial,sans-serif;text-decoration:none;}
#load [hidden]{display:none;}
</style>
<section id="load" aria-label="כניסה לווילה">
  <div class="arrival"><h1>הווילה בקיסריה</h1><p id="arrival-status" role="status">פותח את הסיור התלת־ממדי…</p>
    <nav><a id="arrival-lite" href="../designs.html">תצוגת העיצובים</a><a href="../walk.mp4">צפייה בסרטון</a><a id="arrival-retry" hidden href="">טעינה מחדש</a></nav>
    <noscript><p>לתנועה חופשית ולשינוי רהיטים יש להפעיל JavaScript בדפדפן.</p></noscript>
  </div>
</section>
<script>
(function(){
 var box=document.getElementById('load'),status=document.getElementById('arrival-status'),retry=document.getElementById('arrival-retry');
 function failed(){box.classList.remove('off');box.removeAttribute('aria-hidden');box.removeAttribute('inert');status.textContent='הסיור התלת־ממדי לא נטען במכשיר הזה. אפשר לפתוח את תצוגת העיצובים או לנסות שוב.';retry.hidden=false;}
 window.villaFailure=failed;
 window.addEventListener('error',function(e){if(!box.classList.contains('off') && (e.message || e.target.id==='tour-bundle'))failed();},true);
 window.addEventListener('unhandledrejection',function(){if(!box.classList.contains('off'))failed();});
 setTimeout(function(){if(!box.classList.contains('off') && retry.hidden){status.textContent='המודל עדיין נטען. אפשר בינתיים לפתוח את תצוגת העיצובים.';retry.hidden=false;}},16000);
 try{
   var url=new URL(location.href),dirty=false;
   ['zone','design'].forEach(function(k){var v=url.searchParams.get(k);if(v){var clean=v.replace(/[^a-z]/g,'');if(v!==clean){url.searchParams.set(k,clean);dirty=true;}}});
   if(dirty)history.replaceState(history.state,'',url.href);
   var again=new URL(url.href);again.searchParams.set('quality','compact');retry.href=again.href;
   var zone=url.searchParams.get('zone'),design=url.searchParams.get('design');
   var starter=zone==='kitchen'?'oak':zone==='terrace'?'teak':['original','dunes','arc','atelier'].indexOf(design)>=0?design:'arc';
   box.style.backgroundImage='url("../pictures/'+starter+'.jpg")';
   document.getElementById('arrival-lite').href='../designs.html#'+starter;
 }catch(e){retry.href=location.href;}
})();
</script>

<div class="ui">
  <button id="fly" aria-pressed="false">מבט אווירי</button><button id="tour" hidden>סיור מודרך</button>
  <button class="alt" data-go="deck">דק</button><button class="alt" data-go="pool">בריכה</button><button class="alt" data-go="pergola">פרגולה</button><button class="alt" data-go="entry">כניסה</button><button class="alt" data-go="living">סלון</button>
</div>
<div class="hint" id="where">גרירה לסיבוב · חץ למעלה להליכה</div>
<details id="fin"><summary>בחירת גוונים</summary><div id="pal"></div><button id="resetColors">שחזור גווני המקור</button></details>
<div id="steps" dir="ltr"><button data-move="ArrowLeft" aria-label="סיבוב שמאלה">↶</button><button data-move="w" aria-label="הליכה קדימה">↑</button><button data-move="s" aria-label="הליכה אחורה">↓</button><button data-move="ArrowRight" aria-label="סיבוב ימינה">↷</button></div>
<div class="joy" id="jm"><small>הליכה</small><i></i></div>
<div class="joy" id="jl"><small>מבט</small><i></i></div>

<script defer id="tour-bundle" src="./tour.js?v=ec12bba6c8d0"></script>
</body>
